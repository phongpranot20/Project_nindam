<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บทดสอบ Localhost ของเรา</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #ff4d6d, #ff9f1c, #fff44f, #52d273, #31c7ff, #7b61ff, #e056fd);
            background-size: 300% 300%;
            animation: rainbow 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #2b1649;
        }
        .card {
            background: rgba(255, 255, 255, 0.88);
            padding: 40px;
            border-radius: 24px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 18px 45px rgba(67, 23, 115, 0.3);
            text-align: center;
            backdrop-filter: blur(8px);
        }
        h1 {
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e63946, #f77f00, #43aa8b, #4361ee, #b5179e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p { font-size: 1.1rem; opacity: 0.9; }

        @keyframes rainbow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>jeerawat1กหก01 🚀</h1>
        <p>Succes </p>
    </div>
</body>
</html>
